  glossary: [
    { term: "Qubit", def: "The quantum version of a bit. It can be 0, 1, or a blend of both until measured." },
    { term: "Entanglement", def: "A link between qubits so that measuring one tells you about the other, stronger than any classical link." },
    { term: "Shot", def: "One run of a circuit ending in one measurement. Thousands of shots build up statistics." },
    { term: "Quantum sampling", def: "Running a circuit many times and collecting the outcomes, which follow a distribution set by quantum physics." },
    { term: "Bell test / CHSH", def: "An experiment whose score S cannot exceed 2 for any classical system. Quantum physics allows up to about 2.83." },
    { term: "Classical bound", def: "The best score any non-quantum method can reach on a test. Beating it is the evidence that the quantum part did something." },
    { term: "CZ", def: "A two-qubit gate. Each one adds error, so the number of CZ gates is a rough measure of how hard a circuit is to run." },
    { term: "QPU", def: "Quantum processing unit: the physical quantum chip, as opposed to a simulator." },
    { term: "Dry run", def: "A run on a local simulator of the chip. It tests the pipeline and certifies nothing." },

.gtoday span{position:absolute;top:-2px;left:5px;font:600 10px var(--f-mono);color:var(--amber);white-space:nowrap}
.gkey{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:14px}
.gkey i{display:inline-block;width:18px;height:10px;border-radius:3px;border:1px solid;vertical-align:-1px;margin-right:5px}

/* charts */
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{font:400 12.5px var(--f-mono);fill:var(--muted)}
.chart .val{fill:var(--ink);font-weight:600}
.chart .ax{stroke:var(--line)}
.chart .ours{stroke:var(--cyan);fill:none;stroke-width:2.5;stroke-linejoin:round}
.chart .dot{fill:var(--cyan);stroke:var(--panel-solid);stroke-width:2}
.chart .base{stroke:var(--gray);stroke-dasharray:6 5;stroke-width:1.5}
.chart .b1{fill:var(--cyan)}.chart .b2{fill:var(--gray)}
.means{font-size:14px;color:var(--muted);margin-top:14px;border-left:2px solid var(--cyan);padding-left:12px}
.means b{color:var(--ink);font-weight:600}
.chart h3{font-size:19px;margin-bottom:12px}
.chart details{font-size:13px;margin-top:10px;color:var(--muted)}
.chart summary{cursor:pointer;padding:6px 0}
.chart table{border-collapse:collapse;width:100%;font:12px var(--f-mono)}
.chart td,.chart th{text-align:left;padding:4px 8px 4px 0;border-bottom:1px solid var(--line)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.cmp{position:relative;aspect-ratio:1;max-width:520px;margin:0 auto;border-radius:12px;overflow:hidden;background:#000;--x:50%}
.cmp{cursor:ew-resize;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.cmp canvas,.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.cmp .top{clip-path:inset(0 0 0 var(--x))}
.cmp .hd{position:absolute;top:0;bottom:0;left:var(--x);width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.cmp .hd::after{content:"‹ ›";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font:700 15px var(--f-mono);box-shadow:0 2px 10px rgba(0,0,0,.5)}
.cmp .tg{position:absolute;bottom:8px;font:600 11px var(--f-mono);background:rgba(0,0,0,.72);color:#fff;padding:3px 8px;border-radius:6px}
.cmp-range{width:100%;max-width:520px;display:block;margin:12px auto 0;accent-color:var(--cyan)}
.nod-n{font:600 13px var(--f-mono);color:var(--cyan)}

#nodule{width:100%;aspect-ratio:1.25;display:block;border-radius:12px;cursor:grab;touch-action:pan-y}
.player{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.player input{flex:1;min-width:110px;accent-color:var(--cyan)}
.see-grid{grid-template-columns:1.1fr 1fr}
@media(max-width:900px){.see-grid{grid-template-columns:1fr}}
.stat{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.stat b{font-size:clamp(34px,5vw,52px);line-height:1;color:var(--cyan);white-space:nowrap}
.stat>span{color:var(--muted);font-size:14px;flex:1;min-width:11em}
.chart .gx{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);transition:transform .9s cubic-bezier(.2,.7,.2,1) .15s}
.chart .gy{transform-box:fill-box;transform-origin:center bottom;transform:scaleY(0);transition:transform .7s ease .1s}
.rv.in .gx,.rv.in .gy,details .gx{transform:none}
.agenda{display:none;list-style:none;margin:16px 0 0;padding:0}
.agenda li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0 10px 12px;border-left:3px solid var(--gray);border-bottom:1px solid var(--line)}
.agenda li.run{border-left-color:var(--violet)}.agenda li.done{border-left-color:var(--cyan)}.agenda li.late{border-left-color:var(--red)}
.agenda time{font-size:12px;color:var(--muted)}
.agenda .lane{font:600 11px var(--f-mono);color:var(--muted);text-align:right}
.agenda p{grid-column:1/-1;font-size:15px}
.agenda em{font:400 11px var(--f-mono);color:var(--muted);font-style:normal;margin-left:6px}
@media(max-width:700px){.agenda{display:block}.gscroll,.gkey{display:none}}
.wide{grid-column:1/-1}
.lg{font-size:12.5px;color:var(--muted);margin-bottom:8px;overflow-wrap:anywhere}
.chart .zone{fill:var(--gray);opacity:.12}.chart .stem{stroke:var(--cyan);opacity:.45}.chart .b3{fill:var(--red)}
.tscroll{overflow-x:auto}.tscroll table{min-width:680px}
.wl{margin:0;padding-left:18px;display:grid;gap:8px}
.side{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:900px){.side{grid-template-columns:1fr}}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gal figure{margin:0}
.gal img{width:100%;aspect-ratio:1;display:block;border-radius:8px;background:#000}
.gal figcaption{font:400 11px/1.4 var(--f-mono);color:var(--muted);margin-top:5px}
.credit{font-size:12px;color:var(--muted);margin-top:10px}

/* risks / glossary */
.risk{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.risk:last-child{border:0}
.risk .chip{justify-self:start}
.risk .own{font:400 12px var(--f-mono);color:var(--muted)}
.hyp{padding:16px 0;border-bottom:1px solid var(--line)}.hyp:last-child{border:0}
.hyp h3{font:600 16px/1.35 var(--f-text);letter-spacing:0;margin:8px 0}
.hyp dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0;font-size:14px;color:var(--muted)}
.hyp dt{font:600 11px/1.9 var(--f-mono);text-transform:uppercase}
.hyp dd{margin:0}
@media(max-width:560px){.risk{grid-template-columns:1fr auto}.risk p{grid-column:1/-1;order:3}}
.gloss details{border-bottom:1px solid var(--line)}
.gloss summary{cursor:pointer;padding:13px 0;font:500 17px var(--f-display)}
.gloss p{color:var(--muted);padding:0 0 14px}
footer{max-width:1240px;margin:60px auto 0;padding:24px 16px 60px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);position:relative;z-index:2}

/* overlays */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.toast,.story-pill,.draft{position:fixed;left:50%;transform:translateX(-50%);z-index:70;background:var(--panel-solid);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:13px;max-width:calc(100% - 24px)}
.toast{bottom:20px;opacity:0;pointer-events:none;transition:opacity .3s}.toast.on{opacity:1}
.story-pill{bottom:20px;display:none;min-width:240px;text-align:center;border-color:var(--cyan)}
.story .story-pill{display:block}
.story-pill i{display:block;height:3px;background:var(--cyan);border-radius:3px;margin-top:8px;width:0}
.draft{top:78px;display:none;border-color:var(--amber);z-index:45}
.draft.on{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}

@media (prefers-reduced-motion:reduce){
  .rv{opacity:1;transform:none;transition:none}
  .nav,.nav-links a,.brand i,.hero-copy>*,.hero-legend,#hero-canvas{animation:none}
  .sofar li,.chart .gx,.chart .gy{opacity:1;transform:none;transition:none}
  .slab,.drawer,.scrim{transition:none}
}
@media print{
  :root,:root[data-theme="dark"],:root[data-theme="light"]{--bg:#fff;--bg2:#fff;--ink:#000;--muted:#333;--line:#bbb;--panel:#fff;--panel-solid:#fff;
    --cyan:#005e73;--violet:#4a2ab0;--amber:#8a4a00;--green:#0b7a4b;--red:#a01c30;--gray:#555;--glow:none;--on-accent:#fff}
  body{background:#fff;font-size:11pt}body::before{display:none}
  .nav,#fx,#hero-canvas,.no-print,.drawer,.scrim,.modal,.toast,.story-pill,.draft,.sec-num,#nodule,.cmp-range{display:none!important}
  .print-only{display:block}
  .rv,.sofar li,.chart .gx,.chart .gy{opacity:1!important;transform:none!important}
  .agenda{display:none!important}.gscroll{display:block!important}
  #hero{min-height:0}#hero-ui{padding:0 0 20px}
  section.sec{padding:22px 0 0;max-width:none}
  .panel{backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none!important;break-inside:avoid}
  .win,.pub,.hyp,.risk,.glane,.slab{break-inside:avoid}
  .slab{box-shadow:none}
  .gantt{min-width:0}.gscroll{overflow:visible}
  .wins::before{left:7px}.win,.win:nth-child(even){width:auto;margin-left:30px}.win::before{left:-30px!important;right:auto!important}
  a{color:inherit;text-decoration:none}
  h2{break-after:avoid}
}
</style>

  else if (a === 'copy') { const x = $('#export'); (navigator.clipboard ? navigator.clipboard.writeText(x.value) : Promise.reject()).then(() => toast('Export copied.'), () => { x.select(); try { document.execCommand('copy'); toast('Export copied.'); } catch (e) { toast('Select the text and copy it manually.'); } }); }
  else if (a === 'discard') { store.del(KEY); draftActive = false; DATA = JSON.parse(BASE); closeAll(); render(); toast('Draft discarded.'); }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { stopStory(); closeAll(); return; }
  if (ev.key === 'Tab') { const m = $('.drawer.open,.modal.open'); if (m) { const f = $$('a[href],button,input,select,textarea', m).filter(e => !e.disabled); if (!f.length) return; const a = f[0], z = f[f.length - 1];
    if (ev.shiftKey && (document.activeElement === a || document.activeElement === m)) { z.focus(); ev.preventDefault(); } else if (!ev.shiftKey && document.activeElement === z) { a.focus(); ev.preventDefault(); } } return; }
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName) || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (ev.key === 'e' || ev.key === 'E') { ev.preventDefault(); $('#edit').classList.contains('open') ? closeAll() : openEdit(); }
});
/* comparison slider: drag anywhere on the image (mouse or touch); the range input below stays for keyboard use */
let cmpDrag = false;
const cmpSet = v => { v = clamp(v, 0, 100); const c = $('#cmp'), r = $('#cmp-range'); if (c) c.style.setProperty('--x', v + '%'); if (r) r.value = Math.round(v); };
const cmpAt = ev => { const b = $('#cmp').getBoundingClientRect(); cmpSet((ev.clientX - b.left) / b.width * 100); };
document.addEventListener('pointerdown', ev => { const c = ev.target.closest && ev.target.closest('#cmp'); if (!c) return; cmpDrag = true; try { c.setPointerCapture(ev.pointerId); } catch (e) {} cmpAt(ev); ev.preventDefault(); });
document.addEventListener('pointermove', ev => { if (cmpDrag && $('#cmp')) cmpAt(ev); });
['pointerup', 'pointercancel'].forEach(n => document.addEventListener(n, () => cmpDrag = false));
document.addEventListener('input', ev => { if (ev.target.id === 'cmp-range') cmpSet(+ev.target.value); if (ev.target.id === 'nod-range') Nodule.seek(ev.target.value / 1000); });

/* print: open the glossary so the report is complete */
let reopened = [];
addEventListener('beforeprint', () => { reopened = $$('details:not([open])'); reopened.forEach(d => d.open = true); });
addEventListener('afterprint', () => { reopened.forEach(d => d.open = false); reopened = []; });

/* boot */
Hero.init();
setTheme(new URLSearchParams(location.search).get('theme') || store.get('quantum-progress-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'), false);
render();
if (location.hash.length > 1) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); } // sections are rendered late, so honour deep links by hand
})();
</script>

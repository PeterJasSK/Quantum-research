# #16 — XCIST scanner + protocol approximating the Mayo raw-data scanner (Siemens SOMATOM Definition Flash).
# Every value is cited; "(reduced)" marks a compute reduction for the synthetic reproduction, not the scanner.
# This is an APPROXIMATION from published parameters, not vendor geometry; Mayo decoded the real geometry
# (incl. flying focal spot) with vendor software under a research agreement [F03 §2.1] — we cannot.

# --- geometry ---------------------------------------------------------------------------------------------
scanner.detectorCallback = "Detector_ThirdgenCurved"   # third-generation curved detector (Definition class)
scanner.sid = 595.0                         # source–isocentre (mm): published Definition geometry (Flohr et al. 2006; not in papers/)
scanner.sdd = 1085.6                        # source–detector (mm): same source
scanner.detectorColsPerMod = 1
scanner.detectorColCount = 736              # channels: same source (50 cm SFOV)
scanner.detectorColSize = 1.287             # mm at the detector: 1085.6 mm × 50° fan / 736 ch
scanner.detectorColOffset = 0.25            # quarter-detector offset (standard for third-gen, XCIST default)
scanner.detectorRowsPerMod = 24             # (reduced) Flash: 64 × 0.6 mm (128 slices with z-FFS) [F03 §2.2]; 24 rows ≈ 14.4 mm at iso
scanner.detectorRowCount = scanner.detectorRowsPerMod
scanner.detectorRowSize = 1.095             # 0.6 mm at isocentre [F03 §2.2] × 1085.6/595
scanner.detectorRowOffset = 0.0
scanner.detectorMaterial = "GOS"            # Siemens UFC ceramic is gadolinium-oxysulfide based (approximation)
scanner.detectorDepth = 1.4
scanner.detectionCallback = "Detection_EI"  # energy-integrating
scanner.detectionGain = 15.0
scanner.detectorColFillFraction = 0.9
scanner.detectorRowFillFraction = 0.9
scanner.eNoise = 3500.0                     # XCIST default electronic noise
scanner.focalspotCallback = "SetFocalspot"
scanner.focalspotShape = "Gaussian"
scanner.targetAngle = 7.0
scanner.focalspotWidth = 0.7                # Straton tube small focal spot ~0.7 mm (approximation)
scanner.focalspotLength = 0.7

# --- protocol (axial, so the volume comparison is not confounded by helical interpolation) -----------------
protocol.scanTypes = [1, 1, 1, 1]
protocol.scanTrajectory = "Gantry_Helical"
protocol.tableSpeed = 0                     # axial (reduced from helical; F02 Technique A also reconstructs FBP)
protocol.viewsPerRotation = 500             # (reduced) Definition: ~1152 views/rotation
protocol.viewCount = 500
protocol.startViewId = 0
protocol.stopViewId = protocol.startViewId + protocol.viewCount - 1
protocol.rotationTime = 0.28                # [F03 §2.2]
protocol.mA = 300                           # ≈ 140 quality-reference mAs at 0.28 s / pitch [F03 §2.2] (approximation)
protocol.spectrumFilename = "tungsten_tar7.0_120_filt.dat"   # 120 kV [F03 §2.2]
protocol.bowtie = "large.txt"
protocol.flatFilter = ['Al', 3.0]

# --- recon ------------------------------------------------------------------------------------------------
recon.reconType = 'fdk_equiAngle'
recon.kernelType = 'standard'               # XCIST medium kernel ≈ B46f "medium-sharp" [F03 §2.2] (approximation)
recon.fov = 200.0                           # (reduced) lung-region FOV for the synthetic phantom
recon.imageSize = 400                       # 0.5 mm pixels
recon.sliceCount = 20
recon.sliceThickness = 0.6                  # mm; F03 reconstructed 1.5 mm / 1 mm increment — finer here for volumes
recon.unit = 'HU'
recon.mu = 0.02
recon.huOffset = -1000

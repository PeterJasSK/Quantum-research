# #17 — NAEOTOM Alpha (Siemens photon-counting CT) APPROXIMATION from published parameters only.
# Source: McCabe, Harrawood, Samei, Abadi, Med. Phys. 52(6) 2025 [F04] — the DukeSim PCCT model is NOT public;
# this is XCIST with the parameters F04 states, nothing decompiled. "(assumed)" = not given in F04.

# --- geometry ---------------------------------------------------------------------------------------------
scanner.detectorCallback = "Detector_ThirdgenCurved"
scanner.sid = 595.0                         # (assumed) Siemens gantry SID; F04 lists SID as an input but not its value
scanner.sdd = 1085.6                        # (assumed) Siemens gantry SDD; same
scanner.detectorColsPerMod = 1
scanner.detectorColCount = 1300             # (assumed) ≈ 50 cm FOV at 0.4 mm/iso pitch: 500 / 0.4 ≈ 1250 + margin
scanner.detectorColSize = 0.730             # 0.4 mm at isocentre [F04 §2.2] × 1085.6/595
scanner.detectorColOffset = 0.25
scanner.detectorRowsPerMod = 4              # (reduced) F04: 144 × 0.4 mm collimation [F04 §2.9]
scanner.detectorRowCount = scanner.detectorRowsPerMod
scanner.detectorRowSize = 0.730             # 0.4 mm at isocentre [F04 §2.9]
scanner.detectorRowOffset = 0.0
# --- photon-counting detection ------------------------------------------------------------------------------
scanner.detectionCallback = "Detection_PC"
scanner.detectorMaterial = "CZT"            # F04: CdTe [F04 §2.2]; XCIST ships only a CZT 0.25 mm response (approximation)
scanner.detectorDepth = 1.6                 # matches the shipped response file
scanner.detectionResponseFilename = 'PC_spectral_response_CZT0.25x0.25x1.6.mat'
scanner.detectorBinThreshold = [20, 65, 120]   # thresholds 20 and 65 keV [F04 §2.9]; 120 = kVp upper bound
scanner.detectorSumBins = 1                 # T1 (≥ 20 keV) total-energy image, the closest XCIST analogue
scanner.detectorColFillFraction = 0.9
scanner.detectorRowFillFraction = 0.9
scanner.focalspotCallback = "SetFocalspot"
scanner.focalspotShape = "Gaussian"
scanner.targetAngle = 7.0
scanner.focalspotWidth = 0.6                # (assumed) Vectron small focal spot
scanner.focalspotLength = 0.6
# --- protocol -----------------------------------------------------------------------------------------------
protocol.scanTypes = [1, 1, 1, 1]
protocol.scanTrajectory = "Gantry_Helical"
protocol.tableSpeed = 0                     # (reduced) axial; F04 pitch 0.8 helical [F04 §2.9]
protocol.viewsPerRotation = 1000            # (reduced/assumed)
protocol.viewCount = 1000
protocol.startViewId = 0
protocol.stopViewId = protocol.startViewId + protocol.viewCount - 1
protocol.rotationTime = 0.5                 # [F04 §2.9]
protocol.mA = 304                           # 152 mAs at 0.5 s = 12 mGy level [F04 §2.9] (19/38/72/152 mAs ↔ 1.5/3/6/12 mGy)
protocol.spectrumFilename = "tungsten_tar7.0_120_filt.dat"   # 120 kV [F04 §2.9]
protocol.bowtie = "large.txt"
protocol.flatFilter = ['Al', 3.0]
# --- recon --------------------------------------------------------------------------------------------------
recon.reconType = 'fdk_equiAngle'
recon.kernelType = 'standard'               # F04 used ReconCT QIR-3 with Br40/Br56/Br64; XCIST FBP 'standard' ≈ Br40 (approximation)
recon.fov = 220.0
recon.imageSize = 550                       # 0.4 mm pixels
recon.sliceCount = 1
recon.sliceThickness = 0.4                  # 0.4 mm [F04 §2.9]
recon.unit = 'HU'
recon.mu = 0.02
recon.huOffset = -1000

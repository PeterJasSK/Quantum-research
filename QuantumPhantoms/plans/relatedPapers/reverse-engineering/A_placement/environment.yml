# Feature A environment (plan §4): conda env create -f A_placement/environment.yml
# Python 3.12, not 3.11: shared/ (frozen) uses Path.relative_to(..., walk_up=True), which needs >= 3.12.
# CPU-only torch: no NVIDIA GPU on the reference machine.
name: qp-re-a
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch
      - numpy<2.3
      - scipy
      - scikit-image
      - SimpleITK
      - jsonschema
      - matplotlib
      - pydicom
      - pylidc
      - lungmask
      - TotalSegmentator
      - tcia_utils
      - cryptography          # shared.validate verifies receipt signatures in --stubs
      - setuptools<81         # pylidc 0.2.3 imports pkg_resources
